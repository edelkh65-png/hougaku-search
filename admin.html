<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>楽曲の登録</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261002-9">
</head>
<body>

<header class="site-header narrow">
  <h1>楽曲の登録</h1>
  <p class="lead">楽曲検索に新しい曲を追加します</p>
  <div class="koto" aria-hidden="true">
    <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span><span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span>
  </div>
</header>

<main class="admin">

  <p id="notice" class="notice" hidden></p>

  <!-- ログイン -->
  <section id="login-section" class="panel" hidden>
    <h2>ログイン</h2>
    <p class="hint">登録担当者のメールアドレスとパスワードでログインしてください。</p>
    <form id="login-form" class="stack">
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">ログイン</button>
    </form>
  </section>

  <!-- 登録フォーム -->
  <section id="editor-section" hidden>
    <div class="account">
      <span id="account-email"></span>
      <button type="button" id="logout" class="link-button">ログアウト</button>
    </div>

    <form id="piece-form" class="panel stack" novalidate>
      <h2>曲の情報</h2>

      <div class="field-row">
        <div class="field">
          <label for="title">曲名 <span class="required">必須</span></label>
          <input type="text" id="title" name="title" required>
        </div>
        <div class="field">
          <label for="reading">よみがな <span class="required">必須</span></label>
          <input type="text" id="reading" name="reading" required placeholder="ひらがなで入力（五十音順の並びに使います）">
        </div>
      </div>

      <div class="field">
        <label for="subtitle">副題</label>
        <input type="text" id="subtitle" name="subtitle" placeholder="例：箏二重奏曲">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="composer">作曲者</label>
          <input type="text" id="composer" name="composer" list="composer-list" placeholder="一覧から選ぶか、新しく入力">
          <datalist id="composer-list"></datalist>
        </div>
        <div class="field">
          <label for="composer-reading">作曲者のよみがな <span class="required" id="composer-reading-required" hidden>必須</span></label>
          <input type="text" id="composer-reading" name="composer_reading" placeholder="ひらがなで入力（例：みやぎみちお）" disabled>
          <p class="hint" id="composer-reading-hint">作曲者を入力すると入力できます</p>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="arranger">編曲者</label>
          <input type="text" id="arranger" name="arranger">
        </div>
        <div class="field">
          <label for="category">分類</label>
          <input type="text" id="category" name="category" list="category-list" placeholder="例：古典、新曲、編曲">
          <datalist id="category-list"></datalist>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="year">作曲年</label>
          <input type="text" id="year" name="year" inputmode="numeric" placeholder="例：1985、2020-22">
        </div>
      </div>

      <fieldset class="field">
        <legend>楽器編成</legend>
        <p class="hint">人数が分からない楽器は人数を空欄にしてください。表記を入れると、検索画面ではその表記で表示します（例：箏 独+2）。</p>
        <div id="instrument-rows" class="instrument-rows"></div>
        <button type="button" id="add-instrument" class="secondary">楽器を追加</button>
      </fieldset>

      <div class="field">
        <label for="remarks">備考</label>
        <textarea id="remarks" name="remarks" rows="2"></textarea>
      </div>

      <p id="form-error" class="error" role="alert" hidden></p>
      <div id="duplicate-warning" class="warning" role="alert" hidden></div>
      <div class="actions">
        <button type="submit" id="save" class="primary">登録する</button>
        <button type="button" id="clear" class="secondary">入力をクリア</button>
      </div>
    </form>

    <section class="panel">
      <h2>最近登録した曲</h2>
      <ul id="recent" class="recent"></ul>
    </section>
  </section>

</main>

<footer class="site-footer narrow">
  <p><a href="index.html">楽曲検索へ戻る</a></p>
</footer>

<template id="instrument-row">
  <div class="instrument-row">
    <label class="ir-instrument"><span class="sr-only">楽器</span><select name="key" required></select></label>
    <label class="ir-parts"><span>人数</span><input type="number" name="parts" min="1" max="99"></label>
    <label class="ir-check"><input type="checkbox" name="solo"> 独奏</label>
    <label class="ir-check"><input type="checkbox" name="optional"> 省略可</label>
    <label class="ir-notation"><span class="sr-only">表記</span><input type="text" name="notation" placeholder="表記（任意）"></label>
    <button type="button" class="remove" aria-label="この楽器を削除">×</button>
  </div>
</template>

<script src="config.js?v=20261002-9"></script>
<script src="constants.js?v=20261002-9"></script>
<script src="admin.js?v=20261002-9"></script>
</body>
</html>
