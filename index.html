<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>楽曲検索</title>
<meta name="description" content="箏・尺八・三絃などの邦楽曲を、曲名・よみがな・作曲者・楽器編成から検索できるWebアプリ">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261006-1">
</head>
<body>

<header class="site-header">
  <h1>楽曲検索</h1>
  <p class="lead">箏・尺八・三絃などの楽曲を、曲名・よみがな・作曲者・楽器編成から探せます</p>
  <div class="koto" aria-hidden="true">
    <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span><span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span>
  </div>
</header>

<div class="layout">

  <aside class="filters" aria-label="検索条件">
    <form id="search-form" autocomplete="off">

      <div class="field">
        <label for="q">キーワード</label>
        <input type="search" id="q" name="q" placeholder="例：春の海、みやぎ、沢井忠夫、十七絃">
        <p class="hint">曲名・よみがな・副題・作曲者・編曲者・楽器名・備考が対象です</p>
      </div>

      <details class="advanced" id="advanced">
        <summary><span>詳細検索</span><span id="advanced-count" class="advanced-count" hidden></span></summary>
        <div class="advanced-body">
          <fieldset class="field">
            <legend>楽器</legend>
            <p class="hint">楽器を押して選び、＋・− でパート数を指定できます（指定なしならパート数を問いません）</p>
            <div id="instrument-groups"></div>
            <div class="match-mode" role="radiogroup" aria-label="楽器の一致方法">
              <label><input type="radio" name="mode" value="include" checked> 選んだ楽器をすべて含む</label>
              <label><input type="radio" name="mode" value="exact"> 選んだ楽器だけの編成</label>
            </div>
            <div class="match-mode count-mode" id="count-mode" role="radiogroup" aria-labelledby="count-mode-label" hidden>
              <span class="count-mode-label" id="count-mode-label">指定したパート数</span>
              <label><input type="radio" name="cmp" value="eq" checked> ちょうど</label>
              <label><input type="radio" name="cmp" value="gte"> 以上</label>
            </div>
          </fieldset>

          <div class="field">
            <label for="composer-input">作曲者</label>
            <div class="combo">
              <input type="text" id="composer-input" class="combo-input" placeholder="よみ・名前で探す" autocomplete="off"
                role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="composer-list">
              <div class="combo-selected" id="composer-selected" hidden>
                <span class="combo-name"></span>
                <span class="combo-read"></span>
                <button type="button" class="combo-clear" id="composer-clear" aria-label="作曲者の選択を解除">×</button>
              </div>
              <div class="combo-list" id="composer-list" role="listbox" aria-label="作曲者の候補" hidden></div>
            </div>
            <input type="hidden" id="composer" name="composer">
          </div>

          <div class="field">
            <span class="label" id="players-label">パート数</span>
            <div class="range" aria-labelledby="players-label">
              <input type="number" id="min" name="min" min="1" max="99" placeholder="下限" aria-label="パート数の下限">
              <span>〜</span>
              <input type="number" id="max" name="max" min="1" max="99" placeholder="上限" aria-label="パート数の上限">
              <span>パート</span>
            </div>
          </div>
        </div>
      </details>

      <button type="button" id="reset-button" class="reset">条件をクリア</button>
    </form>
  </aside>

  <main class="results">
    <div class="results-bar">
      <div class="count-wrap">
        <p id="count" aria-live="polite"></p>
        <span id="inst-summary" class="inst-summary" hidden></span>
      </div>
      <div class="results-controls">
        <label class="sort">
          並び順
          <select id="sort">
            <option value="random">ランダム</option>
            <option value="reading">五十音順</option>
            <option value="year">作曲年</option>
            <option value="composer">作曲者</option>
            <option value="players">パート数</option>
          </select>
          <select id="order" aria-label="並びの向き">
            <option value="asc">あ→ん</option>
            <option value="desc">ん→あ</option>
          </select>
        </label>
        <label class="sort">
          表示件数
          <select id="per-page"></select>
        </label>
      </div>
    </div>
    <ul id="list" class="cards"></ul>
    <button type="button" id="more" class="more" hidden></button>
    <p id="empty" class="empty" hidden>条件に合う楽曲が見つかりませんでした。条件を減らしてみてください。</p>
  </main>

</div>

<footer class="site-footer">
  <p>
    <!-- トップページへのリンクは一時的に非表示（復活させるときはコメントを外す）
    <a href="../index.html">トップページへ戻る</a>
    -->
    <a href="admin.html">曲を登録する</a>
  </p>
</footer>

<script src="config.js?v=20261006-1"></script>
<script src="constants.js?v=20261006-1"></script>
<script src="db.js?v=20261006-1"></script>
<script src="combo.js?v=20261006-1"></script>
<script src="app.js?v=20261006-1"></script>
</body>
</html>
